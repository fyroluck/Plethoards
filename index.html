<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PletHoards - Pet Hoard Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { colors: { discord: '#5865F2', discordHover: '#4752C4' } } } }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: 'Inter', sans-serif; background: #080a14; color: #f1f5f9; }
.custom-scrollbar::-webkit-scrollbar { width: 6px; }
.custom-scrollbar::-webkit-scrollbar-track { background: #080a14; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #1b2038; border-radius: 4px; }
.glass-panel { background: rgba(16,20,38,.85); backdrop-filter: blur(12px); border: 1px solid rgba(168,85,247,.15); }
.key-btn { transition: all .2s; cursor: pointer; }
.key-btn:hover { transform: translateY(-2px); }
.key-btn.active { border-color: rgba(250,204,21,.8) !important; box-shadow: 0 0 15px rgba(250,204,21,.2); }
.num-input::-webkit-inner-spin-button { opacity: 1; }
:focus-visible { outline: 2px solid #facc15; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar">

<!-- HEADER -->
<header class="sticky top-0 z-30 glass-panel border-b border-purple-900/30">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <img id="site-logo" src="Untitled Project (3).jpg" alt="PletHoards logo" onerror="this.src='https://images.unsplash.com/photo-1534713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80'" class="w-11 h-11 rounded-xl object-cover border border-yellow-400/40 shadow-lg shadow-purple-900/40">
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">PletHoards</h1>
        <p class="text-xs text-purple-300/70 hidden sm:block">Track economy hoards & rare pet distributions</p>
      </div>
    </div>

    <div id="auth-container">
      <button id="discord-login-btn" onclick="loginWithDiscord()" class="flex items-center space-x-2 bg-discord hover:bg-discordHover text-white px-4 py-2.5 rounded-xl font-medium shadow-lg transition-all text-sm">
        <i class="fa-brands fa-discord text-xl"></i><span>Log in with Discord</span>
      </button>
      <div id="user-profile" class="hidden items-center space-x-3 bg-slate-900/80 p-1.5 pr-4 rounded-xl border border-purple-900/40">
        <img id="user-avatar" src="" alt="" class="w-10 h-10 rounded-lg border border-purple-500/30 object-cover">
        <div class="text-left">
          <div class="flex items-center space-x-1.5">
            <span id="user-name" class="font-bold text-sm text-white">Username</span>
            <span id="mod-badge" class="text-[10px] bg-amber-500/20 text-amber-300 font-semibold px-1.5 py-0.5 rounded border border-amber-500/40 hidden">Editor</span>
          </div>
          <p id="user-role-text" class="text-xs text-purple-300/60">Viewer</p>
        </div>
        <button onclick="logoutDiscord()" class="ml-2 text-slate-400 hover:text-red-400 p-1.5 transition-colors" title="Log out" aria-label="Log out"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>
  </div>
</header>

<div class="max-w-[1600px] mx-auto px-4 py-8 w-full flex-grow">
<main class="max-w-7xl mx-auto w-full space-y-6 min-w-0">

  <!-- TREND FILTER -->
  <section class="glass-panel rounded-2xl p-5 shadow-2xl">
    <div class="flex items-center justify-between gap-4 mb-4 pb-3 border-b border-purple-900/30">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-filter text-yellow-400 text-sm"></i>
        <h2 class="text-sm font-bold text-purple-200">Filter by trend</h2>
      </div>
      <button onclick="setTrendFilter('all')" class="text-xs font-semibold px-3 py-1 bg-purple-950/60 hover:bg-purple-900/80 text-purple-300 rounded-lg border border-purple-800/40">Show all</button>
    </div>
    <div id="trend-keys" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></div>
  </section>

  <!-- CONTROLS -->
  <section class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
    <div class="relative flex-1 max-w-md">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-purple-400/60 text-sm"></i>
      <input type="search" id="search-input" placeholder="Search pet or hoarder name..." class="w-full pl-10 pr-4 py-2.5 bg-slate-950/80 border border-purple-900/40 rounded-xl text-sm text-slate-100 placeholder-purple-300/40 focus:outline-none focus:ring-2 focus:ring-purple-500">
    </div>
    <div class="flex items-center justify-between sm:justify-end gap-4">
      <span id="result-count" class="text-xs text-purple-300/60"></span>
      <button id="add-hoard-btn" onclick="openHoardEditorModal()" class="hidden items-center space-x-2 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-lg">
        <i class="fa-solid fa-plus"></i><span>Add hoard</span>
      </button>
    </div>
  </section>

  <!-- GRID -->
  <section>
    <div id="loading-state" class="text-center py-16 text-purple-300/60"><i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i><p class="text-sm">Loading hoards...</p></div>
    <div id="hoards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    <div id="empty-state" class="hidden text-center py-16 glass-panel rounded-2xl">
      <i class="fa-solid fa-ghost text-4xl text-purple-400/40 mb-3"></i>
      <h3 class="text-lg font-bold text-slate-300">No hoards found</h3>
      <p class="text-sm text-purple-300/50 mt-1">Clear the filter or try another name.</p>
    </div>
  </section>
</main>
</div>

<!-- DETAILS & TRADES MODAL -->
<div id="detail-modal" class="fixed inset-0 z-40 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-md" onclick="if(event.target===this)closeDetail()">
  <div class="glass-panel bg-[#0d1021] rounded-2xl w-full max-w-xl max-h-[85vh] flex flex-col shadow-2xl">
    <div class="flex items-start justify-between gap-3 p-5 pb-4 border-b border-purple-900/30">
      <div id="detail-head" class="min-w-0"></div>
      <button onclick="closeDetail()" class="text-slate-400 hover:text-white p-1" aria-label="Close"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <div class="flex items-center justify-between px-5 pt-4">
      <h4 class="text-xs font-bold text-purple-200 uppercase tracking-wider">Trades</h4>
      <span id="detail-trade-count" class="text-[11px] text-purple-300/60"></span>
    </div>
    <div id="detail-trades" class="p-5 pt-3 space-y-2 overflow-y-auto custom-scrollbar"></div>
  </div>
</div>

<!-- FLAPPY EASTER EGG (click the logo 5 times) -->
<div id="flappy-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4">
  <div class="glass-panel w-full max-w-sm p-5 rounded-2xl space-y-3">
    <div class="flex items-center justify-between">
      <h2 class="text-sm font-bold text-white uppercase tracking-wider"><i class="fa-solid fa-gamepad text-yellow-400 mr-2"></i>Flappy PletHoards</h2>
      <div class="flex items-center gap-2">
        <button onclick="toggleLeaderboard()" class="px-3 py-1 bg-purple-600/80 hover:bg-purple-500 text-white rounded-lg text-xs font-bold"><i class="fa-solid fa-trophy text-yellow-300"></i> Scores</button>
        <button onclick="closeFlappy()" class="text-slate-400 hover:text-white p-1" aria-label="Close"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
    </div>
    <div class="relative mx-auto" style="width:320px;max-width:100%">
      <canvas id="flappy-canvas" width="320" height="480" class="w-full rounded-xl border border-purple-500/40 cursor-pointer touch-none"></canvas>
      <div id="flappy-board" class="hidden absolute inset-0 bg-slate-950/95 rounded-xl p-4 overflow-y-auto"></div>
    </div>
    <p class="text-xs text-purple-300/60 text-center">Space / click to flap</p>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] hidden px-4 py-2.5 rounded-xl text-sm font-semibold shadow-2xl border"></div>

<!-- EDITOR MODAL -->
<div id="hoard-editor-modal" class="fixed inset-0 z-50 flex items-start sm:items-center justify-center p-4 bg-black/85 backdrop-blur-md hidden opacity-0 transition-opacity duration-200 overflow-y-auto">
  <div class="glass-panel bg-[#0d1021] border border-purple-800/40 rounded-2xl w-full max-w-2xl shadow-2xl p-6 my-auto">
    <div class="flex items-center justify-between pb-4 border-b border-purple-900/30 mb-4">
      <h3 id="editor-title" class="text-lg font-bold text-white flex items-center gap-2"></h3>
      <button onclick="closeHoardEditorModal()" class="text-slate-400 hover:text-white p-1" aria-label="Close"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>

    <form id="hoard-form" onsubmit="handleSaveHoard(event)" class="space-y-4">
      <input type="hidden" id="edit-id">
      <input type="hidden" id="input-image-url">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label for="input-pet-name" class="block text-xs font-semibold text-slate-300 mb-1">Pet name</label>
          <input type="text" id="input-pet-name" required placeholder="e.g. Celestial Dragon" class="w-full px-3 py-2 bg-slate-950 border border-purple-900/40 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>
        <div>
          <label for="input-hoarder" class="block text-xs font-semibold text-slate-300 mb-1">Hoarder name</label>
          <input type="text" id="input-hoarder" required placeholder="Shown on the card" class="w-full px-3 py-2 bg-slate-950 border border-purple-900/40 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>
        <div>
          <label for="input-roblox-id" class="block text-xs font-semibold text-slate-300 mb-1">Roblox ID</label>
          <input type="text" id="input-roblox-id" required inputmode="numeric" pattern="\d{5,}" placeholder="e.g. 8399342200" class="w-full px-3 py-2 bg-slate-950 border border-purple-900/40 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>
        <div class="sm:col-span-2">
          <label for="input-discord" class="block text-xs font-semibold text-slate-300 mb-1">Discord user <span class="text-purple-300/50 font-normal">(optional)</span></label>
          <input type="text" id="input-discord" placeholder="e.g. username" class="w-full px-3 py-2 bg-slate-950 border border-purple-900/40 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Pet image</label>
        <div class="border-2 border-dashed border-purple-900/40 hover:border-purple-500 rounded-xl p-3 text-center bg-slate-950 transition-colors relative flex items-center justify-center min-h-[64px]">
          <input type="file" id="image-file-input" accept="image/png, image/jpeg, image/webp" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleFileSelect(event)">
          <p id="dropzone-prompt" class="text-xs font-medium text-slate-300"><i class="fa-solid fa-cloud-arrow-up text-purple-400 mr-1"></i> Drop an image here, or <span class="text-purple-400 underline">browse</span></p>
          <div id="dropzone-preview" class="hidden items-center space-x-3">
            <img id="preview-thumb" src="" alt="Preview" class="w-12 h-12 rounded-lg object-cover border border-purple-800/40">
            <p class="text-xs font-bold text-emerald-400" id="upload-status-text"></p>
          </div>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs font-semibold text-slate-300">Variant counts & trends</label>
          <span class="text-[11px] text-purple-300/60">Leave a count at 0 to show N/A</span>
        </div>
        <div id="variant-fields" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

      <label class="flex items-center space-x-2 cursor-pointer bg-slate-950 p-2.5 rounded-xl border border-purple-900/40 w-full">
        <input type="checkbox" id="input-is-majority" class="w-4 h-4 rounded bg-slate-900 border-purple-800">
        <span class="text-xs font-bold text-slate-200">Owns majority of circulation</span>
      </label>

      <div class="flex items-center justify-end space-x-3 pt-4 border-t border-purple-900/30">
        <button type="button" onclick="closeHoardEditorModal()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-xl text-sm font-medium">Cancel</button>
        <button type="submit" id="save-btn" class="px-5 py-2 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white rounded-xl text-sm font-semibold shadow-lg">Save changes</button>
      </div>
    </form>
  </div>
</div>

<script>
/* ---------- CONFIG ---------- */
const SUPABASE_URL = 'https://hxparrmqbapehkmmbhee.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4cGFycm1xYmFwZWhrbW1iaGVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0Mzc4OTYsImV4cCI6MjEwODAxMzg5Nn0.xZsfgf0z14nUk4N0R3YTnO3Ka7wx-26o0vf3KJ9E1Jc';
const ADMIN_DISCORD_IDS = ['1024720234357194814'];
const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1561859474195615888/oaFtfIhFMrdombJ4tedP9Ne_P1oXqeVy3L1QMFfmYkLDNurvTz3MikaFMeknFqd1rNQN';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

/* ---------- STATE ---------- */
let hoards = [];
let currentUser = null;
let isUserMod = false;
let activeTrendFilter = 'all';
let selectedFileToUpload = null;
const xlOpen = new Set(); // card ids currently showing XL

const TRENDS = {
  rising:   { label: 'Rising',   sub: 'Actively collecting',          img: 'trendrising.png',   emoji: '📈', box: 'emerald' },
  stable:   { label: 'Stable',   sub: 'Holding steady count',         img: 'trendstable.png',   emoji: '⏸️', box: 'amber' },
  unstable: { label: 'Unstable', sub: 'Hoarder may cash any moment',  img: 'trendunstable.png', emoji: '⚡', box: 'indigo' },
  dropping: { label: 'Dropping', sub: 'Actively cashing out',         img: 'trenddropping.png', emoji: '📉', box: 'rose' }
};
const NORMAL_KEYS = [['normal', 'Normal'], ['shiny', 'Shiny'], ['mythic', 'Mythic'], ['shinyMythic', 'Shiny Mythic']];
const XL_KEYS = [['xlNormal', 'XL Normal'], ['xlShiny', 'XL Shiny'], ['xlMythic', 'XL Mythic'], ['xlShinyMythic', 'XL Shiny Mythic']];
const ROW_STYLE = {
  normal: 'bg-slate-950/60 border-purple-900/30 text-slate-300',
  shiny: 'bg-amber-950/20 border-amber-500/20 text-amber-300',
  mythic: 'bg-purple-950/20 border-purple-500/20 text-purple-300',
  shinyMythic: 'bg-cyan-950/30 border-cyan-400/30 text-cyan-300 font-semibold'
};

/* ---------- HELPERS ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getVariantCount = v => (v && typeof v === 'object') ? (parseInt(v.count) || 0) : (parseInt(v) || 0);
const getVariantTrend = v => (v && typeof v === 'object' && v.trend) ? v.trend : 'stable';
const formatCount = v => { const n = getVariantCount(v); return n === 0 ? 'N/A' : n.toLocaleString(); };
const getTotalCount = vs => NORMAL_KEYS.reduce((t, [k]) => t + getVariantCount((vs || {})[k]), 0);
const hasXlVariants = vs => XL_KEYS.some(([k]) => getVariantCount((vs || {})[k]) > 0);

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-sm font-semibold shadow-2xl border ' +
    (ok ? 'bg-emerald-950 border-emerald-500/50 text-emerald-200' : 'bg-rose-950 border-rose-500/50 text-rose-200');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.add('hidden'), 3500);
}

// Icon files. If yours are named differently, change them here.
const ICON_FILES = { rising: 'trendrising.png', stable: 'trendstable.png', unstable: 'trendunstable.png', dropping: 'trenddropping.png', majority: 'trendmajority.png' };

// Tries the exact filename, then other common extensions, and only then falls back to the emoji.
function iconFallback(img) {
  const next = (img.dataset.alts || '').split(',').filter(Boolean);
  if (next.length) { img.dataset.alts = next.slice(1).join(','); img.src = next[0]; return; }
  const s = document.createElement('span');
  s.textContent = img.dataset.emoji; s.className = img.dataset.ecls || 'text-xs'; s.title = img.title;
  img.replaceWith(s);
}
function iconImg(file, alt, cls, emoji, ecls) {
  const base = file.replace(/\.[^.]+$/, '');
  const alts = ['png', 'PNG', 'webp', 'jpg', 'jpeg', 'gif', 'svg'].map(e => `${base}.${e}`).filter(f => f !== file).join(',');
  return `<img src="${file}" alt="${esc(alt)}" title="${esc(alt)}" data-alts="${alts}" data-emoji="${emoji}" data-ecls="${ecls}" onerror="iconFallback(this)" class="${cls}">`;
}

function trendIcon(trend) {
  const t = TRENDS[trend];
  if (!t) return '';
  return iconImg(ICON_FILES[trend], t.label, 'w-4 h-4 object-contain inline-block ml-1', t.emoji, 'text-xs ml-1');
}

/* ---------- AUTH (editor detection) ---------- */
function getDiscordId(user) {
  const ident = (user.identities || []).find(i => i.provider === 'discord');
  const d = (ident && ident.identity_data) || {};
  const m = user.user_metadata || {};
  return String(d.provider_id || d.sub || (ident && ident.id) || m.provider_id || m.sub || '');
}

function applySession(session) {
  currentUser = session ? session.user : null;
  isUserMod = false;
  const loginBtn = document.getElementById('discord-login-btn');
  const profile = document.getElementById('user-profile');

  if (!currentUser) {
    loginBtn.classList.remove('hidden');
    profile.classList.add('hidden'); profile.classList.remove('flex');
  } else {
    const m = currentUser.user_metadata || {};
    isUserMod = ADMIN_DISCORD_IDS.includes(getDiscordId(currentUser));
    loginBtn.classList.add('hidden');
    profile.classList.remove('hidden'); profile.classList.add('flex');
    document.getElementById('user-avatar').src = m.avatar_url || m.picture || 'https://images.unsplash.com/photo-1534713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80';
    document.getElementById('user-name').textContent = m.full_name || m.name || currentUser.email || 'User';
    document.getElementById('mod-badge').classList.toggle('hidden', !isUserMod);
    document.getElementById('user-role-text').textContent = isUserMod ? 'Administrator / Editor' : 'Viewer';
  }
  const addBtn = document.getElementById('add-hoard-btn');
  addBtn.classList.toggle('hidden', !isUserMod);
  addBtn.classList.toggle('flex', isUserMod);
  renderHoards(); // card edit/delete buttons depend on isUserMod
}

// Fires for INITIAL_SESSION, SIGNED_IN (incl. return from Discord), TOKEN_REFRESHED, SIGNED_OUT.
// Avoids the old race where getSession() ran before the OAuth redirect was processed.
supabaseClient.auth.onAuthStateChange((event, session) => {
  setTimeout(() => {
    applySession(session);
    if (event === 'SIGNED_IN' && (location.hash.includes('access_token') || location.search.includes('code='))) {
      history.replaceState({}, '', location.pathname);
    }
  }, 0);
});

async function loginWithDiscord() {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'discord',
    options: { redirectTo: location.origin + location.pathname }
  });
  if (error) toast('Login failed: ' + error.message, false);
}

async function logoutDiscord() {
  try { await supabaseClient.auth.signOut(); } catch (e) {}
  applySession(null);
}

/* ---------- FILTERS ---------- */
function buildTrendKeys() {
  document.getElementById('trend-keys').innerHTML = Object.entries(TRENDS).map(([k, t]) => `
    <button type="button" id="key-${k}" onclick="setTrendFilter('${k}')" class="key-btn flex items-center space-x-3 bg-${t.box}-950/30 hover:bg-${t.box}-950/60 p-3 rounded-xl border border-${t.box}-500/30 text-left">
      ${iconImg(ICON_FILES[k], t.label, 'w-7 h-7 object-contain flex-shrink-0', t.emoji, 'text-xl flex-shrink-0')}
      <div><div class="font-semibold text-${t.box}-400 text-xs">${t.label}</div><p class="text-[11px] text-slate-300">${t.sub}</p></div>
      <span id="kc-${k}" class="ml-auto pl-2 text-sm font-bold text-${t.box}-300"></span>
    </button>`).join('');
}

function setTrendFilter(trend) {
  // clicking the active filter again turns it off
  activeTrendFilter = (trend === activeTrendFilter) ? 'all' : trend;
  Object.keys(TRENDS).forEach(t => document.getElementById('key-' + t).classList.toggle('active', t === activeTrendFilter));
  renderHoards();
}

/* ---------- DATA ---------- */
async function fetchHoardsFromCloud() {
  try {
    const { data, error } = await supabaseClient.from('hoards').select('*');
    if (error) { toast('Could not load hoards: ' + error.message, false); }
    else {
      hoards = (data || []).map(item => ({
        id: String(item.id),
        petName: item.pet_name || item.petName || 'Unnamed',
        hoarder: item.hoarder || '',
        image: item.image,
        isMajority: item.is_majority || item.isMajority || false,
        robloxId: item.roblox_id ? String(item.roblox_id) : '',

      }));

  } catch (err) { toast('Network error while loading hoards', false); }

}

/* ---------- CARD RENDERING ---------- */
function renderVariantsBox(id) {
  const hoard = hoards.find(h => h.id === id);
  const box = document.getElementById('variants-box-' + id);
  if (!hoard || !box) return;
  const v = hoard.variants || {};
  const xl = xlOpen.has(id) && hasXlVariants(v);
  const keys = xl ? XL_KEYS : NORMAL_KEYS;
  const toggle = hasXlVariants(v)
    ? `<button type="button" onclick="toggleXlView('${id}')" class="w-5 h-5 bg-purple-900/50 hover:bg-purple-600 text-purple-200 rounded flex items-center justify-center" title="${xl ? 'Show normal' : 'Show XL'}" aria-label="${xl ? 'Show normal' : 'Show XL'}"><i class="fa-solid fa-arrow-${xl ? 'left' : 'right'} text-[10px]"></i></button>` : '';

  box.innerHTML = keys.map(([key, label], i) => {
    const val = v[key] || { count: 0, trend: xl ? 'none' : 'stable' };
    const style = ROW_STYLE[NORMAL_KEYS[i][0]];
    return `<div class="flex items-center justify-between text-xs p-2 rounded-lg border ${style}">
      <span class="flex items-center gap-1.5">${label} ${trendIcon(getVariantTrend(val))}</span>
      <div class="flex items-center gap-2">${i === 0 ? toggle : ''}<span class="font-bold text-white">${formatCount(val)}</span></div>
    </div>`;
  }).join('');
}

function toggleXlView(id) {
  xlOpen.has(id) ? xlOpen.delete(id) : xlOpen.add(id);
  renderVariantsBox(id);
}

        <button onclick="deleteHoard('${h.id}')" class="p-1.5 bg-slate-900/90 hover:bg-rose-600 text-slate-300 hover:text-white rounded-lg border border-purple-900/40" title="Delete hoard" aria-label="Delete hoard"><i class="fa-solid fa-trash text-xs"></i></button>
      </div>` : '';

        <div>
          <div class="flex items-start space-x-4 mb-4">

              <h3 class="font-bold text-base text-white group-hover:text-yellow-300 transition-colors truncate">${esc(h.petName)}</h3>

function readVariantsFromForm() {
  const out = {};
  [...NORMAL_KEYS, ...XL_KEYS].forEach(([k]) => {
    const count = Math.max(0, parseInt(document.getElementById('vc-' + k).value) || 0);
    let trend = document.getElementById('vt-' + k).value;
    if (k.startsWith('xl') && count === 0) trend = 'none'; // hides the icon on empty XL rows
    out[k] = { count, trend };
  });
  return out;
}

async function sendDiscordWebhook(title, petName, hoarder, totalCount, isMajority, imageUrl, color) {
  if (!DISCORD_WEBHOOK_URL) return;
  try {
    await fetch(DISCORD_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: 'PletHoards Tracker',
        embeds: [{
          title: `${title}: ${petName}`, color, thumbnail: { url: imageUrl },
          fields: [
            { name: '👑 Hoarder', value: `**@${hoarder}** ${isMajority ? '*(Majority Circulation)*' : ''}`, inline: true },
            { name: '📦 Total Hoarded', value: `\`${totalCount === 0 ? 'N/A' : totalCount.toLocaleString()}\``, inline: true },
            { name: '🕒 Timestamp', value: `<t:${Math.floor(Date.now() / 1000)}:R>`, inline: true }
          ],
          footer: { text: 'PletHoards • Pet Economy Tracker' }
        }]
      })
    });
  } catch (err) {}
}

async function handleSaveHoard(e) {
  e.preventDefault();
  if (!isUserMod) return;
  const saveBtn = document.getElementById('save-btn');
  saveBtn.disabled = true; saveBtn.textContent = 'Saving...';

  try {
    const editId = document.getElementById('edit-id').value;
    const petName = document.getElementById('input-pet-name').value.trim();
    const hoarder = document.getElementById('input-hoarder').value.trim();
    const robloxId = document.getElementById('input-roblox-id').value.trim();
    const discordUser = document.getElementById('input-discord').value.trim().replace(/^@/, '');
    if (!/^\d{5,}$/.test(robloxId)) { toast('Roblox ID must be a number (5+ digits).', false); return; }
    const isMajority = document.getElementById('input-is-majority').checked;
    let imageUrl = document.getElementById('input-image-url').value.trim() || 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=300&q=80';

    if (selectedFileToUpload) {
      const ext = selectedFileToUpload.name.split('.').pop();
      const fileName = `${Date.now()}-${Math.random().toString(36).slice(2, 9)}.${ext}`;
      const { error: upErr } = await supabaseClient.storage.from('hoard-images').upload(fileName, selectedFileToUpload);
      if (upErr) { toast('Image upload failed: ' + upErr.message, false); return; }
      imageUrl = supabaseClient.storage.from('hoard-images').getPublicUrl(fileName).data.publicUrl;
    }

    const variants = readVariantsFromForm();
    const payload = { pet_name: petName, hoarder, roblox_id: robloxId, discord_user: discordUser || null, image: imageUrl, is_majority: isMajority, variants };
    const query = editId
      ? supabaseClient.from('hoards').update(payload).eq('id', editId).select()
      : supabaseClient.from('hoards').insert([payload]).select();
    const { data, error } = await query;

    if (error) { toast('Save failed: ' + error.message, false); return; }
    // RLS blocks silently: no error but no rows changed
    if (!data || data.length === 0) { toast('Save blocked by database permissions (check your Supabase policies).', false); return; }

    sendDiscordWebhook(editId ? '✏️ Pet Hoard Updated' : '🚨 New Pet Hoard Tracked', petName, hoarder, getTotalCount(variants), isMajority, imageUrl, editId ? 16113419 : 1095937);
    toast(editId ? 'Hoard updated' : 'Hoard added');
    closeHoardEditorModal();
    await fetchHoardsFromCloud();
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = 'Save changes';
  }
}

async function deleteHoard(id) {
  if (!isUserMod) return;
  const h = hoards.find(x => x.id === id);
  if (!h || !confirm(`Delete "${h.petName}"? This can't be undone.`)) return;
  const { data, error } = await supabaseClient.from('hoards').delete().eq('id', id).select();
  if (error || !data || !data.length) { toast(error ? 'Delete failed: ' + error.message : 'Delete blocked by database permissions.', false); return; }
  sendDiscordWebhook('🗑️ Pet Hoard Removed', h.petName, h.hoarder, getTotalCount(h.variants), h.isMajority, h.image, 16007006);
  toast('Hoard deleted');
  fetchHoardsFromCloud();
}

const variantLabel = v => {
  const x = String(v || '').replace(/[_-]+/g, ' ').trim().toLowerCase();
  return (!x || x === 'normal') ? '' : x.replace(/\b\w/g, c => c.toUpperCase());
};
const fmtVal = n => n == null ? '' : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n);

// Trades are stored by the sync, already filtered to this pet, from the hoarder's point of view:
// { ts, with:{user,name}, gave:[{name,variant,qty,xl?}], received:[...], gaveValue, receivedValue }
function renderDetailTrades() {
  const h = hoards.find(x => x.id === detailId);
  if (!h) return;
  const list = h.trades || [];
  const el = document.getElementById('detail-trades');
  document.getElementById('detail-trade-count').textContent = list.length ? `${list.length} recent` : '';
  if (!list.length) {
    el.innerHTML = '<p class="text-xs text-purple-300/60 text-center py-8">No recent trades involving this pet.</p>';
    return;
  }
  const pet = squash(h.petName);
  const chip = i => {
    const mine = squash(i.name) === pet;
    const label = [variantLabel(i.variant), i.xl ? 'XL' : '', i.name].filter(Boolean).join(' ');
    return `<span class="px-2 py-0.5 rounded-md border text-[11px] ${mine ? 'bg-yellow-400/10 border-yellow-400/40 text-yellow-200' : 'bg-slate-900 border-purple-900/40 text-slate-200'}">${i.qty > 1 ? i.qty + '× ' : ''}${esc(label)}</span>`;
  };

      <div class="flex flex-wrap gap-1.5">${items.length ? items.map(chip).join('') : '<span class="text-[11px] text-slate-500">nothing</span>'}</div>
    </div>`;
  el.innerHTML = list.map(t => {
    const d = t.ts ? new Date(t.ts * 1000).toLocaleDateString() : '';
    const w = t.with || {};
    const who = (w.name || w.user) ? `with ${esc(w.name || w.user)}${w.name && w.user ? ` <span class="text-purple-300/50">(@${esc(w.user)})</span>` : ''}` : 'Trade';
    return `<div class="p-3 rounded-xl bg-slate-950/60 border border-purple-900/30 space-y-2.5">
      <div class="flex justify-between text-[11px] text-slate-300"><span>${who}</span><span class="text-purple-300/60">${d}</span></div>
      ${group('Gave', 'rose', t.gave || [], t.gaveValue)}${group('Received', 'emerald', t.received || [], t.receivedValue)}
    </div>`;
  }).join('');
}

/* ---------- FLAPPY EASTER EGG (click the logo 5 times) ---------- */
const FL = { W: 320, H: 480, GAP: 130, PIPE_W: 52, SPEED: 2.2, GRAV: 0.42, JUMP: -6.6, BX: 64, R: 17 };
let fl = null, flRaf = 0, flBest = 0, logoClicks = 0, logoTimer;
const flImg = new Image(); flImg.src = 'Untitled Project (3).jpg';
try { flBest = parseInt(localStorage.getItem('flappyBest')) || 0; } catch (e) {}

document.getElementById('site-logo').addEventListener('click', () => {
  logoClicks++; clearTimeout(logoTimer);
  logoTimer = setTimeout(() => logoClicks = 0, 2500);
  if (logoClicks >= 5) { logoClicks = 0; openFlappy(); }
});

function openFlappy() {
  const m = document.getElementById('flappy-modal');
  m.classList.remove('hidden'); m.classList.add('flex');
  document.getElementById('flappy-board').classList.add('hidden');
  flReset(); cancelAnimationFrame(flRaf); flLoop();
}
function closeFlappy() {
  cancelAnimationFrame(flRaf);
  const m = document.getElementById('flappy-modal');
  m.classList.add('hidden'); m.classList.remove('flex');
}
function flReset() { fl = { y: FL.H / 2, v: 0, pipes: [], frame: 0, score: 0, state: 'ready', overAt: 0 }; }
function flFlap() {
  if (!fl) return;
  if (fl.state === 'ready') fl.state = 'play';
  if (fl.state === 'play') fl.v = FL.JUMP;
  else if (fl.state === 'over' && Date.now() - fl.overAt > 400) flReset();
}
function flOver() {
  if (fl.state === 'over') return;
  fl.state = 'over'; fl.overAt = Date.now();
  if (fl.score > flBest) { flBest = fl.score; try { localStorage.setItem('flappyBest', flBest); } catch (e) {} }
  submitFlappyScore(fl.score);
}

function flLoop() {
  const x = document.getElementById('flappy-canvas').getContext('2d');
  if (fl.state === 'play') {
    fl.v += FL.GRAV; fl.y += fl.v; fl.frame++;
    if (fl.frame % 85 === 1) fl.pipes.push({ x: FL.W, top: 60 + Math.random() * (FL.H - FL.GAP - 120), passed: false });
    fl.pipes.forEach(p => p.x -= FL.SPEED);
    fl.pipes = fl.pipes.filter(p => p.x > -FL.PIPE_W);
    fl.pipes.forEach(p => {
      if (!p.passed && p.x + FL.PIPE_W < FL.BX - FL.R) { p.passed = true; fl.score++; }
      if (FL.BX + FL.R > p.x && FL.BX - FL.R < p.x + FL.PIPE_W && (fl.y - FL.R < p.top || fl.y + FL.R > p.top + FL.GAP)) flOver();
    });
    if (fl.y + FL.R > FL.H || fl.y - FL.R < 0) flOver();
  }
  x.fillStyle = '#4ec0ca'; x.fillRect(0, 0, FL.W, FL.H);
  x.fillStyle = '#73be2e'; x.strokeStyle = '#000'; x.lineWidth = 2;
  fl.pipes.forEach(p => {
    const by = p.top + FL.GAP;
    x.fillRect(p.x, 0, FL.PIPE_W, p.top); x.strokeRect(p.x, 0, FL.PIPE_W, p.top);
    x.fillRect(p.x, by, FL.PIPE_W, FL.H - by); x.strokeRect(p.x, by, FL.PIPE_W, FL.H - by);
  });
  x.save(); x.beginPath(); x.arc(FL.BX, fl.y, FL.R, 0, Math.PI * 2); x.closePath();
  if (flImg.complete && flImg.naturalWidth) { x.clip(); x.drawImage(flImg, FL.BX - FL.R, fl.y - FL.R, FL.R * 2, FL.R * 2); }
  else { x.fillStyle = '#facc15'; x.fill(); }
  x.restore();
  x.beginPath(); x.arc(FL.BX, fl.y, FL.R, 0, Math.PI * 2); x.strokeStyle = '#facc15'; x.lineWidth = 2; x.stroke();
  x.textAlign = 'center'; x.fillStyle = '#fff'; x.strokeStyle = '#000'; x.lineJoin = 'round';
  const txt = (s, y, size) => { x.font = `800 ${size}px Inter, sans-serif`; x.lineWidth = 4; x.strokeText(s, FL.W / 2, y); x.fillText(s, FL.W / 2, y); };
  txt(String(fl.score), 60, 36);
  if (fl.state === 'ready') txt('Click / Space to fly', 200, 18);
  if (fl.state === 'over') { txt('Game Over', 190, 30); txt(`Score ${fl.score}  ·  Best ${flBest}`, 225, 16); txt('Click / Space to retry', 260, 14); }
  flRaf = requestAnimationFrame(flLoop);
}

async function submitFlappyScore(score) {
  if (score < 1) return;
  const m = (currentUser && currentUser.user_metadata) || {};
  const name = currentUser ? (m.full_name || m.name || 'Player') : 'Guest';
  try { await supabaseClient.from('flappy_scores').insert([{ name: name.slice(0, 24), score }]); } catch (e) {}
}
async function toggleLeaderboard() {
  const b = document.getElementById('flappy-board');
  if (!b.classList.contains('hidden')) { b.classList.add('hidden'); return; }
  b.classList.remove('hidden');
  b.innerHTML = '<p class="text-xs text-purple-300/60 text-center py-8">Loading...</p>';
  const { data, error } = await supabaseClient.from('flappy_scores').select('name,score').order('score', { ascending: false }).limit(10);
  if (error) { b.innerHTML = '<p class="text-xs text-purple-300/60 text-center py-8">Leaderboard unavailable.</p>'; return; }
  b.innerHTML = '<h3 class="text-sm font-bold text-yellow-300 mb-3 text-center">Top scores</h3>' +
    (data.length ? data.map((r, i) => `<div class="flex justify-between text-xs py-1.5 border-b border-purple-900/30"><span class="text-slate-200">${i + 1}. ${esc(r.name)}</span><span class="font-bold text-yellow-300">${r.score}</span></div>`).join('')
                 : '<p class="text-xs text-purple-300/60 text-center py-8">No scores yet.</p>');
}

document.getElementById('flappy-canvas').addEventListener('pointerdown', flFlap);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !document.getElementById('flappy-modal').classList.contains('hidden')) { e.preventDefault(); flFlap(); }
  if (e.key === 'Escape') { closeDetail(); closeFlappy(); }
});

/* ---------- INIT ---------- */
let searchTimer;
document.getElementById('search-input').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(renderHoards, 150); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHoardEditorModal(); });
buildTrendKeys();
buildVariantFields();
fetchHoardsFromCloud();
</script>
